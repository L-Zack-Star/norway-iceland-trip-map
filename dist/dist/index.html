'use strict';
// Presentation only. Existing bookings, clocks, contacts and practical guides remain authoritative.
const toolboxBaseBody=toolBody;
const toolboxTabs=[['activities','活动','mountain'],['flights','航班','plane'],['hotels','酒店','bed'],['transport','自驾','car'],['emergency','应急','phone'],['other','其他','bag']];
Object.assign(toolNames,Object.fromEntries(toolboxTabs.map(([k,n])=>[k,n])));
const toolboxCategory=k=>['roads','lists','offline'].includes(k)?'other':toolboxTabs.some(t=>t[0]===k)?k:'activities';
function toolboxGroups(entries){const now=Date.now(),date=tripToday(new Date(now),DATA.days,tripCalendarChanges).date,past=[],current=[],future=[];for(const x of entries){const elapsed=Number.isFinite(x.endAt)?x.endAt<now:DATA.days[x.end-1]?.date<date,started=Number.isFinite(x.startAt)?x.startAt<=now:DATA.days[x.start-1]?.date<=date;(elapsed?past:started?current:future).push(x);}const order=(a,b)=>a.start-b.start||(a.startAt||0)-(b.startAt||0);[past,current,future].forEach(a=>a.sort(order));const card=(x,kind)=>x.html.replace('class="tb-card"',`class="tb-card ${kind}"`);return (current.length?'<h2 class="tb-period">当前安排</h2>'+current.map(x=>card(x,'is-current')).join(''):'')+(future.length?'<h2 class="tb-period">即将到来</h2>'+future.map((x,i)=>card(x,i?'is-later':'is-next')).join(''):'')+(past.length?`<details class="past-tools tb-past"><summary>此前安排 <span>${past.length}项</span>${dayChevron('right')}</summary><div>${past.map(x=>card(x,'is-past')).join('')}</div></details>`:'')||'<p class="empty-state">这一天没有相应安排。</p>';}
const toolboxGlyph=n=>n==='nav'?'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 2 3 10l8 3 3 8L22 2Z"/></svg>':n==='clock'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/></svg>':outlineIco(n);
const toolboxMeta=(icon,text)=>`<p class="tb-meta">${toolboxGlyph(icon)}<span>${text}</span></p>`;
const toolboxHead=(icon,label,action)=>`<header class="tb-card-head"><span>${ico(icon)}${label}</span>${action}</header>`;
const toolboxDate=d=>`${shortDate(d.date)} · ${visualWeek(d)}`;
function toolboxActivity(b){const d=DATA.days[b.day-1],image=smallPhoto(b.spot),w=journeyBookingWindow(b);return {start:d.id,end:d.id,startAt:w?.start,endAt:w?.end,html:`<article class="tb-card" data-tool-item="activity-${d.id}">${toolboxHead('mountain','活动安排',`<button data-booking="${d.id}">预订详情 ${dayChevron('right')}</button>`)}<div class="tb-card-body">${image?`<img class="tb-photo" src="${image}" width="160" height="180" alt="${esc(DATA.places[b.spot]?.name||b.name)}" loading="eager" decoding="async">`:''}<div class="tb-card-copy"><h3>${esc(b.name)}</h3>${toolboxMeta('calendar',toolboxDate(d))}${toolboxMeta('clock',`${esc(b.report)} 报到 · ${esc(b.time)}`)}<div class="tb-badges"><span>已预订</span><span>${ico('people')}${b.people}人参加</span></div></div></div><div class="tb-card-actions"><button data-day="${d.id}" data-focus-step="${bookingRow(d,b)}">当天行程 ${dayChevron('right')}</button><button data-navigation="${esc(b.meeting||b.spot)}">${toolboxGlyph('nav')}集合点导航</button></div></article>`};}
function toolboxFlight(d,f){const rows=selectedPlan(d),index=rows.findIndex(r=>r.text.includes(f[0])&&stepTimeZones(d,r).flight),w=index>=0?stepWindow(d,rows[index]):null;return {start:d.id,end:d.id,startAt:w?.start,endAt:w?.end,html:`<article class="tb-card" data-tool-item="flight-${esc(f[0])}">${toolboxHead('plane','航班信息',`<button data-day="${d.id}" ${index>=0?`data-focus-step="${index}"`:''}>当天交通 ${dayChevron('right')}</button>`)}<div class="tb-card-body tb-flight-body"><div class="tb-symbol">${ico('plane')}</div><div class="tb-card-copy"><h3 class="tb-flight-route"><span>${esc(f[1])}</span><span aria-hidden="true">→</span><span>${esc(f[4])}</span></h3><p class="tb-cities">${esc(f[2])} → ${esc(f[5])}</p>${toolboxMeta('calendar',`${toolboxDate(d)} · ${esc(f[0])}`)}${toolboxMeta('clock',`${esc(f[3])} 起飞 · ${esc(f[6])} 抵达`)}<p class="tb-note">起降均为当地时间</p></div></div></article>`};}
function toolboxHotel(key){const h=DATA.hotels[key],stay=DATA.days.filter(d=>d.hotel===key),first=stay[0],last=stay.at(-1),checkin=selectedPlan(first).find(r=>/入住/.test(r.stepTitle||'')),checkoutDay=DATA.days[last.id],checkout=checkoutDay&&selectedPlan(checkoutDay).find(r=>/退房/.test(r.stepTitle||'')),out=checkout&&stepWindow(checkoutDay,checkout);return {start:first.id,end:last.id,startAt:checkin?stepWindow(first,checkin)?.start:null,endAt:out?.end??out?.start??null,html:`<article class="tb-card" data-tool-item="hotel-${esc(key)}">${toolboxHead('bed','酒店信息',`<button data-hotel="${esc(key)}">查看详情 ${dayChevron('right')}</button>`)}<div class="tb-card-body"><div class="tb-symbol">${ico('bed')}</div><div class="tb-card-copy"><h3>${esc(h.cn||h.name)}</h3><p class="tb-hotel-name">${esc(h.name)}</p>${toolboxMeta('pin',esc(h.address))}${toolboxMeta('calendar',`${shortDate(first.date)}入住 · ${checkoutDay?shortDate(checkoutDay.date)+'退房':stay.length+'晚'}`)}</div></div><div class="tb-card-actions">${ext(hotelLink(key),toolboxGlyph('nav')+'导航','tb-hotel-nav')}${h.phone?`<a href="tel:${esc(h.phone.replace(/\s/g,''))}">${ico('phone')}电话</a>`:`<button data-copy="${esc(h.name+'\n'+h.address)}">复制地址</button>`}</div></article>`};}
function toolboxOther(){return [['roads','map','天气与道路'],['lists','food','厨房采购'],['offline','bag','离线资料']].map(([key,icon,title])=>`<details class="tb-other"><summary>${ico(icon)}<span>${title}</span>${dayChevron('right')}</summary><div class="tb-other-body">${toolboxBaseBody(key)}</div></details>`).join('');}
toolBody=function(k){k=toolboxCategory(k);const days=toolDay==='all'?DATA.days:DATA.days.filter(d=>d.id===+toolDay);if(k==='activities')return toolboxGroups(DATA.bookings.filter(b=>days.some(d=>d.id===b.day)).map(toolboxActivity));if(k==='flights'){const t=document.createElement('template');t.innerHTML=toolboxBaseBody('flights');const extra=[...t.content.children].filter(e=>e.matches('details.tool-disclosure')).map(e=>e.outerHTML).join('');return toolboxGroups(days.flatMap(d=>(d.flights||[]).map(f=>toolboxFlight(d,f))))+extra;}if(k==='hotels')return toolboxGroups([...new Set(days.map(d=>d.hotel).filter(Boolean))].map(toolboxHotel));if(k==='other')return toolboxOther();if(k==='emergency'){const t=document.createElement('template');t.innerHTML=toolboxBaseBody(k);return (t.content.querySelector('.emergency-contacts')?.outerHTML||'')+(t.content.querySelector('.detail-source')?.outerHTML||'');}return toolboxBaseBody(k);};
toolFilter=function(){return `<label class="tool-date-filter">${outlineIco('calendar')}<select id="toolDate" aria-label="筛选工具箱日期"><option value="all">全部日期</option>${DATA.days.map(d=>`<option value="${d.id}" ${toolDay===String(d.id)?'selected':''}>${toolboxDate(d)}</option>`).join('')}</select></label>`;};
toolboxView=function(){toolCategory=toolboxCategory(toolCategory);return `<header class="utility-header tb-header"><h1>工具箱</h1><p>旅途中随时取用的信息</p></header><nav class="tool-categories" aria-label="工具分类">${toolboxTabs.map(([k,n,icon])=>`<button data-tool="${k}" aria-pressed="${toolCategory===k}">${ico(icon)}${n}</button>`).join('')}</nav><section class="tool-panel"><header class="tool-panel-head"><h2 id="toolTitle">${toolNames[toolCategory]}</h2><div id="toolFilter">${['activities','flights','hotels'].includes(toolCategory)?toolFilter():''}</div></header><div id="toolContent">${toolBody(toolCategory)}</div></section><footer class="tb-footer"><button data-credits>照片来源与许可</button></footer>`;};
const toolboxBaseRender=renderTool;renderTool=function(){toolCategory=toolboxCategory(toolCategory);toolboxBaseRender();mountJourney();};
// The legacy minute updater covers dated tabs; Other also contains dated purchases.
const refreshOtherTools=()=>{if(state.view==='toolbox'&&toolCategory==='other')refreshTemporalTools();};
window.addEventListener('focus',refreshOtherTools);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOtherTools();});
setInterval(refreshOtherTools,60000);

if(state.view==="toolbox")render({restoreY:scrollY});
});</script></body></html>
