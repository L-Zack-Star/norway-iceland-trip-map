    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    .app { display:grid; grid-template-columns:minmax(380px, 470px) 1fr; min-height:100vh; }
    aside { height:100vh; overflow:auto; padding:18px; border-right:1px solid var(--line); background:rgba(255,255,255,.95); }
    #map { height:100vh; }
    h1 { margin:0 0 6px; font-size:25px; letter-spacing:0; }
    .subtitle { margin:0 0 14px; color:var(--muted); line-height:1.45; }
    .toolbar { display:flex; gap:8px; align-items:center; margin:12px 0; }
    .toolbar input { flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:14px; }
    .tabs { display:flex; gap:8px; overflow:auto; padding:0 0 10px; }
    .tabs button { border:1px solid var(--line); background:#fff; border-radius:8px; min-width:54px; padding:8px 9px; cursor:pointer; color:var(--ink); }
    .tabs button.active { background:var(--blue); border-color:var(--blue); color:#fff; }
    .day-head { position:sticky; top:0; z-index:2; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); padding:10px 0; }
    .day-title { font-size:18px; font-weight:800; margin-bottom:5px; }
    .sun { display:flex; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:13px; }
    .chip { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:999px; padding:4px 8px; background:#fff; }
    .route-link { color:var(--blue); text-decoration:none; }
    .item { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; margin:10px 0; box-shadow:0 8px 18px rgba(23,32,51,.06); }
    .item.hidden { display:none; }
    .item-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .name { font-weight:800; line-height:1.25; }
    .title { color:var(--muted); font-size:13px; margin-top:2px; }
    .time { color:var(--blue); font-weight:800; white-space:nowrap; }
    .desc { color:#344054; line-height:1.5; margin:9px 0; }
    .meta { color:var(--muted); font-size:13px; line-height:1.45; margin:8px 0 0; }
    .status { font-weight:700; }
    .status.verified { color:var(--green); }
    .status.open-area { color:var(--cyan); }
    .status.seasonal, .status.reservation, .status.listing { color:var(--orange); }
    .status.unverified, .status.closed-risk { color:var(--red); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .actions a { color:var(--blue); text-decoration:none; border:1px solid #b9d6ff; border-radius:8px; padding:7px 9px; background:#f7fbff; font-size:13px; }
    .legend { display:grid; grid-template-columns:1fr 1fr; gap:7px; color:var(--muted); font-size:12px; margin:8px 0 12px; }
    .leaflet-popup-content { font-family:"Microsoft YaHei", sans-serif; }
    @media (max-width: 860px) {
      .app { grid-template-columns:1fr; }
      aside { height:58vh; border-right:0; border-bottom:1px solid var(--line); }
      #map { height:42vh; }
    }
  </style>

    const map = L.map('map', { scrollWheelZoom:true }).setView([64.5, 4], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    let current = 0;

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    function hoursLine(item) {
      const h = item.hours || {};
      if (!h.open && !h.close) return '营业时间：需复核';
      const status = h.status || 'unverified';
      return `<span class="status ${esc(status)}">${esc(status)}</span> · 营业/关门：${esc(h.open || '需复核')} - ${esc(h.close || '需复核')}${h.lastEntry ? ' · 最晚入场 ' + esc(h.lastEntry) : ''}${h.note ? '<br>' + esc(h.note) : ''}`;
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = DAYS.map((d, i) => `<button class="${i === current ? 'active' : ''}" onclick="render(${i})">D${String(i+1).padStart(2,'0')}</button>`).join('');
    }

    function matches(item, q, day) {
      if (!q) return true;
      const hay = [day.date, day.city, day.title, item.name, item.title, item.desc, item.type].join(' ').toLowerCase();
      return hay.includes(q);
    }

    function render(index = current) {
      current = index;
      const q = document.getElementById('search').value.trim().toLowerCase();
      const day = DAYS[current];
      renderTabs();
      layer.clearLayers();
      const visible = day.items.filter(item => matches(item, q, day));
      const bounds = [];
      for (const item of visible) {
        if (Number.isFinite(item.lat) && Number.isFinite(item.lng)) {
          const marker = L.marker([item.lat, item.lng]).addTo(layer);
          marker.bindPopup(`<strong>${esc(item.name)}</strong><br>${esc(item.time || item.title || '')}<br><a href="${esc(item.googleMaps)}" target="_blank">Google Maps</a>`);
          bounds.push([item.lat, item.lng]);
        }
      }
      if (bounds.length) map.fitBounds(bounds, { padding:[30,30], maxZoom: 11 });
      document.getElementById('timeline').innerHTML = `
        <div class="day-head">
          <div class="day-title">${esc(day.date)} · ${esc(day.title)}</div>
          <div class="sun">
            <span class="chip">日出 ${esc(day.sunrise)}</span>
            <span class="chip">日落 ${esc(day.sunset)}</span>
            <span class="chip">${esc(day.city)}</span>
            ${day.routeUrl ? `<a class="chip route-link" href="${esc(day.routeUrl)}" target="_blank">当天路线 Google Maps</a>` : ''}
          </div>
        </div>
        ${visible.map(item => `
          <article class="item">
            <div class="item-top">
              <div><div class="name">${esc(item.name)}</div><div class="title">${esc(item.title)} · ${esc(item.type)}</div></div>
              <div class="time">${esc(item.time)}</div>
            </div>
            <p class="desc">${esc(item.desc)}</p>
            <p class="meta">${hoursLine(item)}</p>
            <div class="actions"><a href="${esc(item.googleMaps)}" target="_blank">Google Maps</a></div>
          </article>
        `).join('') || '<p class="subtitle">没有匹配结果。</p>'}
      `;
    }

    document.getElementById('search').addEventListener('input', () => render(current));
    render(0);
  </script>
